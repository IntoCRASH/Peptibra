name: Apply Vercel compatibility fix
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility update
        run: |
          tar -xzf vercel-fix.tar.gz
          rm vercel-fix.tar.gz
          rm -f .github/workflows/apply-vercel-fix.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Peptibra compatible with Vercel"
          git push
