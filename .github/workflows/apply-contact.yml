name: Apply contact page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-contact.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply contact update
        run: |
          tar -xzf contact-update.tar.gz
          rm contact-update.tar.gz
          rm -f .github/workflows/apply-contact.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Peptibra contact page and email form"
          git push
