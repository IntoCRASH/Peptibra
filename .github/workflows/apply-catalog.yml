name: Apply catalog update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -xzf catalog-update.tar.gz
          rm catalog-update.tar.gz
          rm -f .github/workflows/apply-catalog.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add functional Peptibra catalog"
          git push
