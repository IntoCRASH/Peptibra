name: Compilar instalador Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pywebview pythonnet
          choco install innosetup --no-progress -y
      - name: Compilar aplicación
        run: pyinstaller --noconfirm --clean windows/Peptibra.spec
      - name: Compilar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\Peptibra.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Peptibra-Windows
          path: dist/Peptibra-Setup-*.exe
          if-no-files-found: error
