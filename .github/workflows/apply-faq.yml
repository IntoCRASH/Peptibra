name: Apply FAQ update
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FAQ update
        run: |
          tar -xzf faq-update.tar.gz
          rm faq-update.tar.gz
          rm -f .github/workflows/apply-faq.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Peptibra FAQ page"
          git push
